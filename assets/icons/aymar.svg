<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f4f4f2"/>
  <g transform="translate(0, 20)">
    <!-- Elegant Roof Line -->
    <path d="M 240 120 L 290 60 L 340 120" stroke="#c49a45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- AYMAR Text -->
    <g fill="#1a2530" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="76" letter-spacing="6">
      <!-- Letter A -->
      <text x="260" y="190" text-anchor="middle">A</text>
      <!-- Letter Y with Gold Accent -->
      <text x="325" y="190" text-anchor="middle">Y</text>
      <path d="M 325 152 L 340 125" stroke="#c49a45" stroke-width="7" stroke-linecap="round"/>
      <!-- Letter M -->
      <text x="400" y="190" text-anchor="middle">M</text>
      <!-- Letter A -->
      <text x="480" y="190" text-anchor="middle">A</text>
      <!-- Letter R -->
      <text x="545" y="190" text-anchor="middle">R</text>
    </g>

    <!-- HOUSE Text -->
    <text x="400" y="260" fill="#1a2530" font-family="'Cinzel', 'Georgia', serif" font-weight="600" font-size="34" letter-spacing="14" text-anchor="middle">HOUSE</text>
  </g>
</svg>


